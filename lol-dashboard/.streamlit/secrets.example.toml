# Copy to `.streamlit/secrets.toml` for local use, and paste the same values
# into Streamlit Community Cloud's Secrets box when deploying.
#
# secrets.toml is gitignored. The repo is public — see roster.example.txt —
# so nothing here may ever be committed.

# ---------------------------------------------------------------------------
# Who is allowed in.
#
# Signing in only proves someone controls an email address; this list is what
# makes it *your* group. An empty or missing list denies everyone, on purpose:
# a typo'd key name should lock the door, not remove it.
#
# These are email addresses, not accounts on any particular service. The app
# matches the address and ignores which provider issued it, so people can mix
# Google, Microsoft and anything else freely.
# ---------------------------------------------------------------------------
allowed_emails = """
you@example.com
friend1@outlook.com
friend2@gmail.com
"""

# ---------------------------------------------------------------------------
# Identity providers. Shared settings go under [auth]; each provider gets its
# own [auth.<name>] table, and the sign-in screen renders one button per
# provider automatically.
#
# Pick whichever combination covers your group:
#
#   google     — works with ANY email address, not just gmail.com. Anyone can
#                create a Google account on an existing address.
#   microsoft  — outlook.com / hotmail.com / live.com, and work accounts.
#   auth0      — one client that itself offers Google, Microsoft, Apple,
#                GitHub and email+password. Simplest when the group is mixed;
#                free up to 25k monthly users.
#
# Redirect URIs to register with each provider:
#   http://localhost:8501/oauth2callback
#   https://<your-app>.streamlit.app/oauth2callback
# ---------------------------------------------------------------------------
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
# Generate with: python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "CHANGE_ME"

# --- Recommended: one provider that covers everyone -----------------------
# Auth0 is itself a broker: enable Google, Microsoft, Apple, GitHub and
# email+password inside its dashboard, and the app sees one button. Best fit
# for a group on mixed email hosts, and it covers anyone with no social
# login at all. Free to 25,000 monthly users.
[auth.auth0]
client_id = "xxx"
client_secret = "xxx"
server_metadata_url = "https://{account}.{region}.auth0.com/.well-known/openid-configuration"

# --- Alternative: wire providers directly ---------------------------------
# Two buttons instead of one. Uncomment these and comment out [auth.auth0].
#
# [auth.google]
# client_id = "xxxxxxxx.apps.googleusercontent.com"
# client_secret = "xxxxxxxx"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
#
# [auth.microsoft]
# client_id = "xxx"
# client_secret = "xxx"
# `common` lets any personal or work Microsoft account sign in.
# server_metadata_url = "https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration"
